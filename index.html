<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dominique Plez · Diseñadora UX/UI</title>
<meta name="description" content="Portfolio de Dominique Plez, diseñadora UX/UI generalista con especial interés en el diseño de interacción.">
<meta property="og:title" content="Dominique Plez · Diseñadora UX/UI">
<meta property="og:description" content="Portfolio de Dominique Plez, diseñadora UX/UI generalista con especial interés en el diseño de interacción.">
<meta name="theme-color" content="#5B3FC4">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.root{transition:background-color .5s ease,color .5s ease}
.root a{color:var(--accent)}
.root a:hover{color:var(--text)}
.root :focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.nav-link{text-decoration:none;color:var(--muted)!important;font-weight:500;padding:10px 4px;min-height:44px;display:inline-flex;align-items:center}
.nav-link:hover{color:var(--text)!important}
.cta{transition:background-position .5s ease,transform .2s ease;background-size:200% 100%;background-position:0% 50%}
.cta:hover{background-position:100% 50%;transform:translateY(-2px)}
.card{transition:transform .25s ease,box-shadow .25s ease,background-color .5s ease,border-color .5s ease}
.card:hover{transform:translateY(-6px);box-shadow:0 24px 48px -24px rgba(30,27,75,.35)}
.card:hover .arrow{transform:translateX(4px)}
.arrow{transition:transform .2s ease;display:inline-block}
.scanline{position:absolute;left:10%;right:10%;height:2px;background:#E86A92;box-shadow:0 0 12px 2px rgba(232,106,146,.55);top:18%;opacity:0}
.card:hover .scanline{animation:scan 1.4s ease-in-out 1;opacity:1}
@keyframes scan{0%{top:18%;opacity:1}90%{top:82%;opacity:1}100%{top:82%;opacity:0}}
.ripple{transition:transform .4s ease}
.pscroll{transition:object-position 2.4s ease}
.card:hover .pscroll{object-position:center bottom}
.pphone{transition:transform .4s ease}
.card:hover .pphone{transform:translateY(-14px) rotate(-3deg)}
@media (max-width:640px){.pphone{display:none}}
.card:hover .ripple{transform:scale(1.04)}
.cord-line{transition:height .18s ease}
.bead{transition:box-shadow .5s ease,transform .18s ease}
.cord-btn:hover .bead{transform:scale(1.08)}
.ul a{text-decoration:underline!important;text-underline-offset:3px}
.rm,.rm *{transition:none!important;animation:none!important}
.rm .card:hover{transform:none}
.rm .card:hover .scanline{opacity:0}
@media (prefers-reduced-motion: reduce){.root,.root *{transition:none!important;animation:none!important}.card:hover{transform:none}.card:hover .scanline{opacity:0}}
@media (max-width:640px){.cord{right:12px!important}}
.btn{cursor:pointer;transition:transform .15s ease,box-shadow .2s ease,background-color .2s ease,border-color .2s ease,color .2s ease,filter .2s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 20px -12px rgba(30,27,75,.55)}
.btn:active{transform:translateY(0) scale(.97);box-shadow:none}
.btn[aria-pressed="false"]:hover{background:var(--soft)!important;border-color:var(--accent)!important}
.btn[aria-pressed="true"]:hover{filter:brightness(1.12)}
button.btn:not([aria-pressed]):hover,a.btn:hover{border-color:var(--accent)!important}
a.btn-dark:hover{background:rgba(255,255,255,.12)!important;border-color:#FFFFFF!important}
.tlink{transition:color .2s ease}
.tlink:hover{color:var(--accent)!important;text-decoration:underline;text-underline-offset:4px}
.logo .mark{transition:transform .4s ease}
.logo:hover .mark{transform:rotate(180deg)}
.card{cursor:pointer}
.rm .btn:hover,.rm .btn:active,.rm .logo:hover .mark{transform:none}
@media (prefers-reduced-motion: reduce){.btn:hover,.btn:active,.logo:hover .mark{transform:none}}

.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--tray);border:var(--bw) solid var(--border);border-radius:14px}
.seg .btn:hover{transform:none!important}
.seg .btn[aria-pressed="false"]:hover{background:var(--card)!important;color:var(--accent)!important}
.seg .btn[aria-pressed="true"]{box-shadow:0 2px 6px -2px rgba(30,27,75,.45)}
.tag{display:inline-flex;align-items:center;background:var(--tagBg);color:var(--muted);border-radius:6px;padding:3px 9px;font-size:.75em;font-weight:600;line-height:1.5}
.btn:hover{transform:translateY(-1px)!important}
.btn:active,.cta:active{transform:translateY(2px)!important;box-shadow:none!important}
.mlink{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 14px;border-radius:12px;text-decoration:none;color:var(--text)!important;font-weight:700}
.mlink:hover{background:var(--soft)}
.only-m{display:none!important}
@media (max-width:760px){
.only-d{display:none!important}
.only-m{display:flex!important}
.hdr{padding-right:56px!important}
.cord{transform:scale(.8);transform-origin:top center;right:8px!important}
.hero-side{display:none!important}
.hero-center{width:220px!important;max-width:72%!important}
.feat-img{order:-1;min-height:220px!important}
.mailbtn{font-size:.9375em!important;padding:0 16px!important;white-space:nowrap}
}
@media (max-width:520px){.name-c{display:none}}
@media (max-width:400px){.name-m{display:none}}
@media (hover:none){
.btn:hover{transform:none!important}
.btn[aria-pressed="false"]:hover{background:var(--card)!important;border-color:var(--chip)!important}
.seg .btn[aria-pressed="false"]:hover{background:transparent!important;color:var(--text)!important}
button.btn:not([aria-pressed]):hover,a.btn:hover{border-color:var(--chip)!important}
.lift:hover,.card:hover{transform:none}
}
.wa{transition:transform .2s ease}
.wa:hover{transform:scale(1.08)}
@media (prefers-reduced-motion: reduce){.wa:hover{transform:none}}
@keyframes rise{from{opacity:0;translate:0 28px}to{opacity:1;translate:0 0}}
@keyframes drop{from{opacity:0;translate:0 -14px}to{opacity:1;translate:0 0}}
@keyframes pop{from{opacity:0;translate:0 24px;scale:.96}to{opacity:1;translate:0 0;scale:1}}
.root .hdr{position:relative;z-index:30;animation:drop .6s cubic-bezier(.2,.7,.2,1) both}
.root .hdr ~ section:first-of-type > *{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.root .hdr ~ section:first-of-type > :nth-child(1){animation-delay:.2s}
.root .hdr ~ section:first-of-type > :nth-child(2){animation:pop .9s cubic-bezier(.2,.7,.2,1) .4s both}
.root .hdr ~ section:first-of-type > :nth-child(3){animation-delay:.55s}
.root .hdr ~ section:first-of-type > :nth-child(n+4){animation-delay:.65s}
.sprog{display:none}
@supports (animation-timeline: view()){
@keyframes revealUp{from{opacity:0;translate:0 56px;scale:.98}to{opacity:1;translate:0 0;scale:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sprog{display:block;position:fixed;top:0;left:0;right:0;height:4px;z-index:40;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#E86A92,#8B6CF0,#5B8DEF);animation:grow linear both;animation-timeline:scroll(root)}
}
.rm .sprog{display:none}
@media (prefers-reduced-motion: reduce){.sprog{display:none}}
[data-rv="wait"]{opacity:0;translate:0 44px}
[data-rv="in"]{animation:rvUp .8s cubic-bezier(.2,.7,.2,1) var(--rvd,0s) both}
@keyframes rvUp{from{opacity:0;translate:0 44px}to{opacity:1;translate:0 0}}
.rm [data-rv]{opacity:1!important;translate:none!important;animation:none!important}
@media (prefers-reduced-motion: reduce){[data-rv]{opacity:1!important;translate:none!important;animation:none!important}}
</style>

</head>
<body>
<div id="root"></div>
<template id="dc-tpl">

<div class="{{rootClass}}" lang="{{lang}}" style="{{rootStyle}}">

<div class="cord" style="position:absolute; top:0; right:40px; display:flex; flex-direction:column; align-items:center; z-index:5">
<span aria-hidden="true" style="width:22px; height:6px; border-radius:0 0 6px 6px; background:var(--text); opacity:.7"></span>
<span class="cord-line" aria-hidden="true" style="{{cordLine}}"></span>
<button class="cord-btn" type="button" onClick="{{pull}}" aria-pressed="{{darkPressed}}" aria-label="{{t.cord}}" title="{{t.cord}}" style="width:44px; height:44px; margin-top:-4px; border:none; background:transparent; padding:0; cursor:pointer; display:flex; align-items:flex-start; justify-content:center">
<span class="bead" style="{{beadStyle}}"></span>
</button>
</div>

<div style="max-width:1200px; margin:0 auto; display:flex; flex-direction:column; gap:24px">

<header class="hdr" style="position:relative; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:8px 72px 8px 8px">
<a class="logo" href="#top" style="text-decoration:none; color:var(--text); font-weight:800; font-size:1.25em; letter-spacing:-0.02em; display:inline-flex; align-items:center; gap:10px; min-height:44px">
<svg class="mark" width="38" height="38" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="dpflow" gradientUnits="userSpaceOnUse" x1="0" y1="5" x2="0" y2="95"><stop offset="0" stop-color="#E86A92"></stop><stop offset=".5" stop-color="#8B6CF0"></stop><stop offset="1" stop-color="#5B8DEF"></stop></linearGradient></defs><circle cx="50" cy="50" r="20" fill="none" stroke="url(#dpflow)" stroke-width="10"></circle><path d="M70 22 V50 M30 50 V78" fill="none" stroke="url(#dpflow)" stroke-width="10" stroke-linecap="round"></path><circle cx="70" cy="13" r="8.5" fill="url(#dpflow)"></circle><circle cx="30" cy="87" r="8.5" fill="url(#dpflow)"></circle></svg>
<span class="name-m">Dominique Plez</span></a>
<div style="display:flex; align-items:center; gap:12px">
<div class="only-d" style="display:flex; align-items:center; gap:20px">
<nav aria-label="{{t.navLabel}}" style="display:flex; gap:20px; font-size:.9375em">
<a class="nav-link" href="#work">{{t.navWork}}</a>
<a class="nav-link" href="#how">{{t.navHow}}</a>
<a class="nav-link" href="#about">{{t.navAbout}}</a>
<a class="nav-link" href="#contact">{{t.navContact}}</a>
</nav>
<div class="seg" role="group" aria-label="{{t.langLabel}}" style="flex-wrap:nowrap">
<sc-for list="{{langOpts}}" as="o" hint-placeholder-count="2">
<button class="btn" type="button" lang="{{o.code}}" aria-pressed="{{o.pressed}}" aria-label="{{o.aria}}" onClick="{{o.pick}}" style="{{o.st}}">{{o.label}}</button>
</sc-for>
</div>
</div>
<button class="btn" type="button" onClick="{{togglePanel}}" aria-expanded="{{panelExpanded}}" aria-controls="a11y-panel" aria-label="{{t.a11yOpen}}" title="{{t.a11yOpen}}" style="flex:none; width:44px; height:44px; border-radius:12px; border:1.5px solid var(--chip); background:var(--card); color:var(--text); box-shadow:0 3px 0 var(--chip); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.5" r="1.8"></circle><path d="M5 8.5l7 1.5 7-1.5"></path><path d="M12 10v5"></path><path d="M9 21l3-6 3 6"></path></svg></button>
<button class="btn only-m" type="button" onClick="{{toggleMenu}}" aria-expanded="{{menuExpanded}}" aria-controls="mobile-menu" style="align-items:center; gap:8px; min-height:44px; padding:0 14px; border-radius:12px; border:1.5px solid var(--chip); background:var(--card); color:var(--text); font:inherit; font-weight:700; font-size:.9375em; box-shadow:0 3px 0 var(--chip)">
<sc-if value="{{menuClosed}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></sc-if>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></sc-if>
{{t.menu}}
</button>
</div>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<div id="mobile-menu" class="only-m" style="position:absolute; top:calc(100% + 8px); left:0; right:0; z-index:15; flex-direction:column; gap:4px; background:var(--card); border:var(--bw) solid var(--border); border-radius:20px; padding:10px; box-shadow:0 24px 48px -20px rgba(30,27,75,.45)">
<nav aria-label="{{t.navLabel}}" style="display:flex; flex-direction:column; gap:2px">
<a class="mlink" href="#work" onClick="{{closeMenu}}">{{t.navWork}} <span aria-hidden="true" style="color:var(--accent)">→</span></a>
<a class="mlink" href="#how" onClick="{{closeMenu}}">{{t.navHow}} <span aria-hidden="true" style="color:var(--accent)">→</span></a>
<a class="mlink" href="#about" onClick="{{closeMenu}}">{{t.navAbout}} <span aria-hidden="true" style="color:var(--accent)">→</span></a>
<a class="mlink" href="#contact" onClick="{{closeMenu}}">{{t.navContact}} <span aria-hidden="true" style="color:var(--accent)">→</span></a>
</nav>
<div style="display:flex; justify-content:space-between; align-items:center; gap:12px; border-top:var(--bw) solid var(--border); margin-top:6px; padding:12px 14px 4px">
<span style="font-weight:700; font-size:.9375em">{{t.langLabel}}</span>
<div class="seg" role="group" aria-label="{{t.langLabel}}" style="flex-wrap:nowrap">
<sc-for list="{{langOpts}}" as="o" hint-placeholder-count="2">
<button class="btn" type="button" lang="{{o.code}}" aria-pressed="{{o.pressed}}" aria-label="{{o.aria}}" onClick="{{o.pick}}" style="{{o.st}}">{{o.label}}</button>
</sc-for>
</div>
</div>
</div>
</sc-if>
</header>

<section id="top" style="background:var(--card); border:var(--bw) solid var(--border); border-radius:32px; padding:clamp(28px,5vw,64px); display:flex; flex-wrap:wrap; gap:40px; align-items:center">
<div style="flex:999 1 520px; min-width:0; display:flex; flex-direction:column; gap:20px">
<p style="margin:0; font-size:clamp(1.2em, 1vw + .9em, 1.5em); font-weight:700; letter-spacing:-0.01em; color:var(--accent)">{{t.hello}}</p>
<h1 style="margin:0; font-size:clamp(2.1em, 4vw + 1em, 4.6em); line-height:1.04; letter-spacing:-0.035em; font-weight:800">{{t.h1}}</h1>
<p style="margin:0; font-size:1.1875em; line-height:var(--lh); color:var(--muted); max-width:640px">{{t.bio}}</p>
<div style="display:flex; flex-wrap:wrap; gap:12px; margin-top:8px">
<a class="cta" href="#work" style="text-decoration:none; background-image:linear-gradient(90deg,#F1A7B9,#C9B2F2,#9DB8F5,#F1A7B9); color:#1E1B4B; font-weight:700; font-size:1em; padding:0 26px; min-height:52px; border-radius:14px; box-shadow:0 3px 0 rgba(30,27,75,.3); display:inline-flex; align-items:center; gap:10px">{{t.cta1}} <span aria-hidden="true">→</span></a>
<a class="btn" href="#contact" style="text-decoration:none; color:var(--text); font-weight:600; font-size:1em; padding:0 24px; min-height:52px; border-radius:14px; border:1.5px solid var(--chip); background:var(--card); box-shadow:0 3px 0 var(--chip); display:inline-flex; align-items:center">{{t.cta2}}</a>
</div>
<p style="margin:4px 0 0; display:inline-flex; align-items:center; gap:8px; font-size:.875em; font-weight:600; color:var(--muted)">
<span aria-hidden="true" style="width:8px; height:8px; border-radius:50%; background:#3BB58A"></span>{{t.avail}}</p>
</div>
<div style="flex:1 1 280px; display:flex; justify-content:center">
<div style="position:relative; width:300px; max-width:100%">
<div aria-hidden="true" style="position:absolute; inset:18px -18px -18px 18px; border-radius:28px; background:linear-gradient(135deg,#F1A7B9,#C9B2F2,#9DB8F5)"></div>
<img src="assets/foto-domi.jpg" alt="{{t.photo}}" style="position:relative; display:block; width:100%; aspect-ratio:4/5; object-fit:cover; object-position:center 30%; border-radius:28px; border:var(--bw) solid var(--border); box-sizing:border-box">
</div>
</div>
</section>

<section id="work" style="display:flex; flex-direction:column; gap:20px; padding-top:32px">
<div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:12px; padding:0 8px">
<div>
<h2 style="margin:0; font-size:2.25em; letter-spacing:-0.025em; font-weight:800">{{t.workTitle}}</h2>
</div>
<p style="margin:0; color:var(--muted); font-size:1em">{{t.workSub}}</p>
</div>

<a class="card" href="portal-transparencia.html" style="text-decoration:none; color:inherit; background:var(--card); border:var(--bw) solid var(--border); border-radius:32px; overflow:hidden; display:flex; flex-wrap:wrap">
<div style="flex:999 1 440px; min-width:0; padding:clamp(28px,4vw,48px); display:flex; flex-direction:column; gap:16px; justify-content:center">
<p style="margin:0; font-size:.8125em; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent)">{{t.portalTag}}</p>
<h3 style="margin:0; font-size:2.5em; letter-spacing:-0.03em; font-weight:800; line-height:1.1">{{t.portalTitle}}</h3>
<p style="margin:0; font-size:1.125em; line-height:var(--lh); color:var(--muted)">{{t.portalDesc}}</p>
<div style="display:flex; flex-wrap:wrap; gap:8px">
<sc-for list="{{t.portalChips}}" as="chip" hint-placeholder-count="3">
<span class="tag">{{chip}}</span>
</sc-for>
</div>
<p style="margin:8px 0 0; font-weight:700; color:var(--text); font-size:1em">{{t.read}} <span class="arrow" aria-hidden="true">→</span></p>
</div>
<div class="feat-img" style="flex:1 1 420px; min-height:360px; position:relative; overflow:hidden; background:#E4E6FF">
<img class="ripple" src="assets/card_portal.jpg" alt="" style="position:absolute; inset:0; display:block; width:100%; height:100%; object-fit:cover; object-position:center top">
</div>
</a>

<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:20px">
<a class="card" href="binsort.html" style="text-decoration:none; color:inherit; background:var(--card); border:var(--bw) solid var(--border); border-radius:32px; overflow:hidden; display:flex; flex-direction:column">
<div style="position:relative; height:260px; overflow:hidden; background:#E3E3FF">
<img class="ripple" src="assets/card_binsort.jpg" alt="" style="display:block; width:100%; height:100%; object-fit:cover; object-position:center top">
<span aria-hidden="true" style="position:absolute; left:38%; right:38%; top:8%; bottom:0"><span class="scanline"></span></span>
</div>
<div style="padding:28px 32px 32px; display:flex; flex-direction:column; gap:12px">
<p style="margin:0; font-size:.8125em; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent)">{{t.binTag}}</p>
<h3 style="margin:0; font-size:1.75em; letter-spacing:-0.025em; font-weight:800; line-height:1.15">Binsort</h3>
<p style="margin:0; font-size:1em; line-height:var(--lh); color:var(--muted)">{{t.binDesc}}</p>
<p style="margin:4px 0 0; font-weight:700; font-size:1em">{{t.read}} <span class="arrow" aria-hidden="true">→</span></p>
</div>
</a>

<a class="card" href="super-scan.html" style="text-decoration:none; color:inherit; background:var(--card); border:var(--bw) solid var(--border); border-radius:32px; overflow:hidden; display:flex; flex-direction:column">
<div style="height:260px; overflow:hidden; background:#E8F6EC">
<img class="ripple" src="assets/card_superscan.jpg" alt="" style="display:block; width:100%; height:100%; object-fit:cover; object-position:center top">
</div>
<div style="padding:28px 32px 32px; display:flex; flex-direction:column; gap:12px">
<p style="margin:0; font-size:.8125em; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent)">{{t.superTag}}</p>
<h3 style="margin:0; font-size:1.75em; letter-spacing:-0.025em; font-weight:800; line-height:1.15">Super Scan</h3>
<p style="margin:0; font-size:1em; line-height:var(--lh); color:var(--muted)">{{t.superDesc}}</p>
<p style="margin:4px 0 0; font-weight:700; font-size:1em">{{t.read}} <span class="arrow" aria-hidden="true">→</span></p>
</div>
</a>
</div>
</section>

<section id="how" style="background:var(--card); border:var(--bw) solid var(--border); border-radius:32px; padding:clamp(28px,4vw,56px); display:flex; flex-direction:column; gap:28px; margin-top:32px">
<div>
<h2 style="margin:0; font-size:2.25em; letter-spacing:-0.025em; font-weight:800">{{t.howTitle}}</h2>
</div>
<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px">
<sc-for list="{{t.principles}}" as="p" hint-placeholder-count="4">
<div style="background:var(--soft); border:var(--softBorder); border-radius:24px; padding:28px; display:flex; flex-direction:column; gap:10px">
<span style="font-size:.8125em; font-weight:800; color:var(--accent)">{{p.n}}</span>
<h3 style="margin:0; font-size:1.25em; font-weight:700">{{p.title}}</h3>
<p style="margin:0; font-size:.9375em; line-height:var(--lh); color:var(--muted)">{{p.text}}</p>
</div>
</sc-for>
</div>
</section>

<section id="about" style="display:flex; flex-wrap:wrap; gap:20px; margin-top:12px">
<div style="flex:999 1 480px; min-width:0; background:var(--card); border:var(--bw) solid var(--border); border-radius:32px; padding:clamp(28px,4vw,48px); display:flex; flex-direction:column; gap:16px">
<h2 style="margin:0; font-size:2em; letter-spacing:-0.025em; font-weight:800">{{t.aboutTitle}}</h2>
